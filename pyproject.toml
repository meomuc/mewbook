[project]
name = "smartdoc-library"
version = "0.1.0"
description = "SmartDoc Library - metadata-first ebook/document manager"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymupdf>=1.24",
    "pillow>=10.4",
    "watchdog>=4.0",
    "pyside6>=6.11.2",
    "requests>=2.34.2",
]

[project.scripts]
smartdoc = "smartdoc.app:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=8.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smartdoc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
